repository: https://github.com/1l0/err-releases
release_filter: '^v[0-9]+\.[0-9]+\.[0-9]+$'
match: 'arm64.*\.apk$'

name: err
summary: A local-first worldbuilding & narrative editor.
description: |
  **err** is a local-first editor for worldbuilding and narrative work.

  - Items form one graph; multiple parents and typed links keep related
    material together.
  - Tree Views are saved starting points into that graph.
  - Properties, computed values and undo/redo are part of the Item workflow.
  - err uses the camera only to scan a pairing QR code; changes then move
    between devices with end-to-end encryption.
  - Runs as a Web PWA and a native Android app.

  The vault stays on your device. Learn more at <https://err.tokyo>.
license: Apache-2.0
website: https://err.tokyo
tags: [writing, worldbuilding, notes, productivity]

icon: ./icon-512.png
